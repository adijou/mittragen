[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[functions."sponsors"]
included_files = ["assets/fonts/*.ttf", "assets/fonts/LICENSE-DejaVu.txt"]

[functions."finance"]
node_bundler = "esbuild"
external_node_modules = ["pdfkit"]
included_files = ["assets/fonts/*.ttf", "assets/fonts/LICENSE-DejaVu.txt", "node_modules/pdfkit/js/data/*"]

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
